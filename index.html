<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0f14"><title>しらす式 キングダム覇道 完凸シュミレーター</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b0f14;color:#f3f6fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}main{max-width:760px;margin:auto;padding:18px 14px 50px}h1{text-align:center;color:#e8b84a;font-size:24px}p.sub{text-align:center;color:#9da8b5;font-size:13px}.card{background:#151b23;border:1px solid #303a46;border-radius:16px;padding:16px;margin:12px 0}h2{font-size:17px;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:13px;color:#9da8b5}input{width:100%;margin-top:5px;padding:12px 9px;border:1px solid #303a46;border-radius:10px;background:#0b0f14;color:#f3f6fa;font-size:16px}.toggle{display:flex;justify-content:space-between;align-items:center}.toggle input{width:26px;height:26px}.packhead,.packrow{display:grid;grid-template-columns:1.15fr .8fr .9fr .7fr;gap:7px}.packhead{font-size:11px;color:#9da8b5}button{min-height:48px;border-radius:12px;border:0;font-weight:700;font-size:16px}.primary{width:100%;background:#e8b84a;color:#17120a}.secondary{background:#202833;color:#f3f6fa;border:1px solid #303a46;padding:0 14px;margin-top:10px}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.result{text-align:center;background:#202833;border-radius:12px;padding:13px}.result span{font-size:12px;color:#9da8b5}.result b{display:block;margin-top:5px;font-size:18px}.mid b{color:#e8b84a}#route{line-height:1.7;font-size:14px;margin-top:15px}.hint{font-size:12px;color:#9da8b5;line-height:1.5}.error{color:#ff7b72}footer{text-align:center;color:#9da8b5;font-size:11px;line-height:1.6;margin-top:20px}@media(max-width:520px){.results{grid-template-columns:1fr}.result{display:flex;justify-content:space-between}.result b{margin:0}}</style></head><body><main>
<h1>しらす式 キングダム覇道<br>完凸シュミレーター</h1><p class="sub">手持ち覇道石・排出率・販売パックから課金目安を計算</p>
<div class="card"><h2>① 現在の状況</h2><div class="grid"><label>目標まで必要な枚数<input id="need" type="number" min="0" value="10"></label><label>手持ち覇道石<input id="stones" type="number" min="0" value="0"></label><label>現在の登用回数<input id="progress" type="number" min="0" value="0"></label><label>10連の必要覇道石<input id="tenCost" type="number" min="1" value="1400"></label></div></div>
<div class="card"><h2>② ガチャ設定</h2><div class="grid"><label>通常排出率 %<input id="normal" type="number" step=".001" value=".120"></label><label>20回確定枠 %<input id="p20" type="number" step=".1" value="6"></label><label>100回確定枠 %<input id="p100" type="number" step=".1" value="60"></label><label>100%確定（何回ごと）<input id="pity" type="number" min="1" value="200"></label></div><p class="hint">存在しない確定枠は0にしてください。</p></div>
<div class="card"><div class="toggle"><div><h2>③ 150枚パック</h2><div class="hint">販売されている場合のみON</div></div><label><input id="specialOn" type="checkbox"> 使用</label></div><div id="specialFields" class="grid" style="margin-top:12px;opacity:.4"><label>価格<input id="specialPrice" type="number" value="15000"></label><label>登用札<input id="specialTickets" type="number" value="150"></label><label>付属覇道石<input id="specialStone" type="number" value="7300"></label><label>購入上限<input id="specialMax" type="number" value="2"></label></div></div>
<div class="card"><h2>④ その他のパック</h2><div class="packhead"><span>価格</span><span>札</span><span>石</span><span>上限</span></div><div id="packs"></div><button id="addPack" class="secondary">＋ パック追加</button></div>
<button id="calc" class="primary">目標まで計算する</button>
<div class="card"><h2>計算結果</h2><div class="results"><div class="result"><span>🔥 上振れ</span><b id="good">—</b></div><div class="result mid"><span>🎯 平均目安</span><b id="avg">—</b></div><div class="result"><span>☠️ 下振れ</span><b id="bad">—</b></div></div><div id="route">条件を入力して計算してください。</div></div>
<footer>しらす式 キングダム覇道 完凸シュミレーター<br>※確率上の試算です。実際の排出結果を保証するものではありません。ご利用は計画的に。</footer>
</main><script>
(()=>{"use strict";const $=x=>document.getElementById(x),V=(x,m=0)=>Math.max(m,Number($(x).value)||0);
let packs=[{p:9800,t:70,s:4800,m:7},{p:3000,t:20,s:1400,m:4},{p:160,t:2,s:70,m:1}];
function draw(){let b=$("packs");b.innerHTML="";packs.forEach((r,i)=>{let d=document.createElement("div");d.className="packrow";d.style.marginTop="7px";["p","t","s","m"].forEach(k=>{let n=document.createElement("input");n.type="number";n.min=0;n.value=r[k];n.oninput=()=>packs[i][k]=Math.max(0,+n.value||0);d.appendChild(n)});b.appendChild(d)})}draw();
$("addPack").onclick=()=>{if(packs.length<10){packs.push({p:0,t:0,s:0,m:1});draw()}};$("specialOn").onchange=()=>$("specialFields").style.opacity=$("specialOn").checked?1:.4;
function stonePulls(s){return Math.floor(s/V("tenCost",1))*10}
function qAt(g){let n=Math.min(1,V("normal")/100),a=Math.min(1,V("p20")/100),b=Math.min(1,V("p100")/100),p=Math.floor(V("pity",1));if(g%p===0)return 1;if(b&&g%100===0)return b;if(a&&g%20===0)return a;return n}
function stats(need,prog){let pity=Math.floor(V("pity",1)),mod=prog%pity,max=(pity-mod)+(need-1)*pity,dp=Array(need+1).fill(0);dp[0]=1;let ex=0,g=null,b=null;for(let n=1;n<=max;n++){ex+=1-dp[need];let q=qAt(prog+n),nx=Array(need+1).fill(0);for(let k=0;k<=need;k++){if(k===need)nx[k]+=dp[k];else{nx[k]+=dp[k]*(1-q);nx[Math.min(need,k+1)]+=dp[k]*q}}dp=nx;if(g===null&&dp[need]>=.25)g=n;if(b===null&&dp[need]>=.90)b=n}return{g:g??max,a:Math.ceil(ex),b:b??max,max}}
function products(){let a=packs.filter(x=>x.p>0&&x.m>0).map(x=>({...x,m:Math.min(30,Math.floor(x.m))}));if($("specialOn").checked)a.unshift({p:V("specialPrice"),t:V("specialTickets"),s:V("specialStone"),m:Math.min(30,Math.floor(V("specialMax")))});return a}
function cheapest(target,base){let ps=products(),best=null;function go(i,c,t,s,d){if(best&&c>=best.c)return;if(t+stonePulls(base+s)>=target){best={c,d:[...d]};return}if(i>=ps.length)return;let x=ps[i];for(let n=0;n<=x.m;n++)go(i+1,c+n*x.p,t+n*x.t,s+n*x.s,n?d.concat(`${x.p.toLocaleString()}円×${n}`):d)}go(0,0,0,0,[]);return best}
const F=x=>x?x.c.toLocaleString()+"円":"商品上限では不足";
$("calc").onclick=()=>{try{let need=Math.floor(V("need")),stones=V("stones"),prog=Math.floor(V("progress"));if(!need){$("good").textContent=$("avg").textContent=$("bad").textContent="0円";$("route").innerHTML="<b>目標達成済みです。</b>";return}let s=stats(need,prog),pl=[s.g,s.a,s.b].map(x=>cheapest(x,stones));$("good").textContent=F(pl[0]);$("avg").textContent=F(pl[1]);$("bad").textContent=F(pl[2]);$("route").innerHTML=`🔥 上振れ（25%到達）：約<b>${s.g}連</b><br>🎯 平均期待回数：約<b>${s.a}連</b><br>☠️ 下振れ（90%到達）：約<b>${s.b}連</b><br>🛡️ 確定のみでの最大：約<b>${s.max}連</b><br><br>💰 平均時の最安購入候補：<b>${pl[1]?(pl[1].d.join(" → ")||"手持ち覇道石のみ"):"登録商品の購入上限では不足"}</b><br><span class="hint">現在の登用回数は確定枠の進行位置として使用します。例：150回なら200回確定まであと50回として計算します。</span>`}catch(e){$("route").innerHTML='<span class="error">計算エラーです。入力値を確認してください。</span>'}};
})();
</script></body></html>
